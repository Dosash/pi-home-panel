<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b21;
    --line: #2a2f37;
    --text: #e6e8eb;
    --muted: #8b929c;
    --accent: #58a6ff;
    --bad: #f85149;
    --field: #0f1115;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
    padding: 16px;
  }
  form {
    width: 100%;
    max-width: 340px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  h1 { margin: 0 0 6px; font-size: 20px; }
  label { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 13px; }
  input[type=text], input[type=password] {
    background: var(--field);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    font: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .remember { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 14px; }
  .remember input { width: 16px; height: 16px; accent-color: var(--accent); }
  button {
    margin-top: 4px;
    background: var(--accent);
    color: #0b1220;
    border: 0;
    border-radius: 8px;
    padding: 11px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  #error { color: var(--bad); font-size: 14px; min-height: 0; }
  #error:empty { display: none; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Вход</h1>
  <div id="error"></div>
  <label>Логин
    <input type="text" name="user" autocomplete="username" autocapitalize="off" required autofocus>
  </label>
  <label>Пароль
    <input type="password" name="password" autocomplete="current-password" required>
  </label>
  <label class="remember">
    <input type="checkbox" name="remember" checked> Запомнить меня на 30 дней
  </label>
  <input type="hidden" name="next" id="next">
  <button type="submit">Войти</button>
</form>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("error").textContent = q.get("error") || "";
  document.getElementById("next").value = q.get("next") || "/";
</script>
</body>
</html>
