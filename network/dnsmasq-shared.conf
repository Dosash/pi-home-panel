# DHCP для профилей NetworkManager в режиме shared (lan-cable на eth0, hotspot на wlan0).
# Установлен в /etc/NetworkManager/dnsmasq-shared.d/pi-network.conf, читается всеми их dnsmasq.
# dnsmasq помечает каждый запрос тегом с именем интерфейса — по нему и различаем.

# DNS для устройств — AdGuard Home на порту 53 (~/project/adguard). Сам dnsmasq отвечает на 5354
# только про локальное: pi.lan и имена устройств из DHCP, в том числе обратные записи (PTR) —
# AdGuard спрашивает их у него, поэтому в его статистике видны имена устройств, а не только IP.
port=5354
domain=lan
local=/lan/

# Кабель: адрес выдаём, а шлюз и DNS — нет. Подключённый компьютер видит Pi и панель,
# но свой интернет оставляет как был (иначе Mac пустил бы весь трафик через LTE-модем).
dhcp-option=tag:eth0,option:router
dhcp-option=tag:eth0,option:dns-server

# Wi-Fi: DNS — AdGuard Home на этом же адресе (сам dnsmasq не на 53-м и себя не предложит).
dhcp-option=tag:wlan0,option:dns-server,10.20.0.1

# Имя Pi для устройств в точке доступа: http://pi.lan:45461
interface-name=pi.lan,wlan0
